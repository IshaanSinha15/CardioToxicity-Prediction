<!-- public/illustrations/loading-ai.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250">

<rect width="500" height="250" rx="20" fill="#F8FAFC"/>

<circle cx="250" cy="70" r="28"
fill="none"
stroke="#2563EB"
